kind: pipeline
type: docker
name: deploy-static-site

# 禁用默认克隆，使用 SSH 连接
clone:
  disable: true

steps:
  # 0. 使用 SSH 克隆
  - name: clone
    image: alpine/git
    pull: if-not-exists
    environment:
      SSH_KEY:
        from_secret: github_ssh_key
    commands:
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      - SSH_URL=$(echo $DRONE_GIT_HTTP_URL | sed 's|https://github.com/|git@github.com:|')
      - echo "使用 SSH 克隆：$SSH_URL"
      - git clone --depth=1 --branch=$DRONE_BRANCH $SSH_URL .
      - git checkout $DRONE_COMMIT

  # 1. 构建项目
  - name: build
    image: node:20
    pull: if-not-exists
    environment:
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    commands:
      - echo "开始构建..."
      - corepack enable
      - pnpm config set registry https://registry.npmmirror.com
      - pnpm install --frozen-lockfile
      - pnpm run build
      - echo "构建完成，产物在 dist/"
  
  # 2. 通过 SCP 上传到服务器临时目录（只上传 dist/）
  - name: upload
    image: appleboy/drone-scp
    pull: if-not-exists
    settings:
      host:
        from_secret: server_host
      username:
        from_secret: server_user
      port: 22
      key:
        from_secret: server_ssh_key
      # 上传前清空临时目录
      rm: true
      # 本地构建目录（根据你的项目调整）
      source: dist/*
      # 服务器临时目录
      target: /tmp/drone-deploy
  
  # 3. 通过 SSH 执行部署命令（同步到你指定的目录）
  - name: deploy
    image: appleboy/drone-ssh
    pull: if-not-exists
    environment:
      DEPLOY_PATH:
        from_secret: deploy_path
    settings:
      host:
        from_secret: server_host
      username:
        from_secret: server_user
      port: 22
      key:
        from_secret: server_ssh_key
      envs:
        - DEPLOY_PATH
      script:
        - echo "开始部署..."
        - if [ -z "$DEPLOY_PATH" ]; then echo "缺少部署目录：请在 Drone Secret 配置 deploy_path" && exit 1; fi
        - echo "目标目录：$DEPLOY_PATH"
        - mkdir -p "$DEPLOY_PATH"
        - RELEASES_DIR="$DEPLOY_PATH/.releases"
        - mkdir -p "$RELEASES_DIR"
        - RELEASE_DIR="$RELEASES_DIR/$(date +%Y%m%d%H%M%S)"
        - mkdir -p "$RELEASE_DIR"
        - rsync -a --delete /tmp/drone-deploy/ "$RELEASE_DIR/"
        - ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
        - echo "部署完成：$DEPLOY_PATH/current"

# 触发条件
trigger:
  branch:
    - main
    - master
  event:
    - push

